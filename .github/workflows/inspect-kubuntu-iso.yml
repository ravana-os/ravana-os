name: Inspect Kubuntu ISO

# Looks inside the official Kubuntu ISO (layout, squashfs layers, installer config) so the Ravana remix
# is built on facts, not guesses.
on:
  push:
    branches: [ravana-kubuntu]
    paths: [.github/workflows/inspect-kubuntu-iso.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the ISO and check it
        run: |
          base=https://cdimage.ubuntu.com/kubuntu/releases/26.04.1/release
          curl -fsSL --retry 5 -o SHA256SUMS "$base/SHA256SUMS"
          curl -fL --retry 5 -o kubuntu.iso "$base/kubuntu-26.04.1-desktop-amd64.iso"
          grep ' \*kubuntu-26.04.1-desktop-amd64.iso' SHA256SUMS | sed 's/ \*kubuntu-26.04.1-desktop-amd64.iso/  kubuntu.iso/' | sha256sum -c -
      - name: Look inside
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xorriso squashfs-tools >/dev/null
          mkdir -p report
          xorriso -osirrox on -indev kubuntu.iso -extract /casper/filesystem.squashfs fs.sqfs >/dev/null 2>&1
          sudo unsquashfs -d root -f fs.sqfs >/dev/null
          {
            echo "## files with 'Try Kubuntu' / 'Kubuntu Website'"
            sudo grep -rIl --exclude-dir=locale -E 'Try Kubuntu|Kubuntu Website' root/usr root/etc 2>/dev/null | head -30
            echo "## binaries"
            sudo grep -rl -a 'Try Kubuntu' root/usr/bin root/usr/libexec root/usr/lib/x86_64-linux-gnu 2>/dev/null | head
            echo "## autostart"
            ls root/etc/xdg/autostart | head -80
          } > report/strings.txt 2>&1
          for f in $(sudo grep -rIl --exclude-dir=locale -E 'Try Kubuntu|Kubuntu Website' root/usr root/etc 2>/dev/null | head -8); do echo "===== $f"; sudo head -c 3000 "$f"; echo; done > report/string-files.txt 2>&1
          cat report/strings.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: kubuntu-inspect
          path: report/
